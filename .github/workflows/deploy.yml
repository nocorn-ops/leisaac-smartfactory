name: Deploy Docusaurus to GitHub Pages

# 注意：上游 doc 站点已归档到 docs_archive/upstream_docs_site/（对本仓库已过时），
# 本 workflow 保留但指向归档路径。本项目日常不使用它。
defaults:
  run:
    shell: bash
    working-directory: ./docs_archive/upstream_docs_site

on:
  push:
    branches:
      - main
    paths:
      - 'docs_archive/upstream_docs_site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    paths:
      - 'docs_archive/upstream_docs_site/**'
      - '.github/workflows/deploy.yml'
    # Review gh actions docs if you want to further define triggers, paths, etc
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#on

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs_archive/upstream_docs_site/package-lock.json

      - name: Install dependencies
        run: npm ci
      - name: Build website
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs_archive/upstream_docs_site/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
